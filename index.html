<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5ed" />
    <meta name="description" content="Pawblossom Puzzle — 핍과 함께 퍼즐을 풀고 꽃밭을 가꾸는 매치3 게임." />
    <title>Pawblossom Puzzle</title>
    <link rel="icon" type="image/svg+xml" href="/assets/tiles/flower.svg" />
    <style>
      html{background:#f6f5ed}body{margin:0}
      #app-startup{box-sizing:border-box;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 42%,#edf4db,#f6f5ed 72%);color:#36573e;text-align:center;font-family:system-ui,sans-serif}
      #app-startup img{display:block;max-width:100%;object-fit:contain}
      #app-startup p{margin:0}
      #app-startup .startup-name{font-family:Georgia,serif;font-size:28px;line-height:1.1}
      #app-startup .startup-name span{display:block;margin-top:7px;font-family:system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase}
      #app-startup .startup-status{font-size:14px;line-height:1.6;color:#53634b;overflow-wrap:anywhere}
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-startup" role="status" aria-live="polite" aria-atomic="true">
        <img src="/assets/pip-idle-open-v2.webp" alt="" width="112" height="112" decoding="async" />
        <p class="startup-name">Pawblossom<span>Puzzle</span></p>
        <p class="startup-status"><span lang="ko">불러오는 중</span><span aria-hidden="true"> · </span><span lang="en">Loading</span></p>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
