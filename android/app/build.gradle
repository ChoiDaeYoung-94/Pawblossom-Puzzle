apply plugin: 'com.android.application'

// 실값은 Git 밖 로컬 파일에만 둡니다. 파싱 실패도 런타임에서 구성 오류로 차단합니다.
def billingTest = new Properties()
try {
    def config = rootProject.file('billing-test.properties')
    if (config.exists()) config.withInputStream { billingTest.load(it) }
} catch (Exception ignored) { billingTest.setProperty('productId', '__invalid__') }

android {
    namespace = "com.choidaeyoung.pawblossompuzzle"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.choidaeyoung.pawblossompuzzle"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "0.1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'BILLING_TEST_PRODUCT_ID', groovy.json.JsonOutput.toJson(billingTest.getProperty('productId', '').trim())
            buildConfigField 'String', 'BILLING_TEST_PUBLIC_KEY', groovy.json.JsonOutput.toJson(billingTest.getProperty('publicKey', '').trim())
            buildConfigField 'boolean', 'BILLING_TEST_PERMANENT_PRODUCT', (billingTest.getProperty('permanentProductConfirmed', '') == 'true').toString()
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    debugImplementation('com.android.billingclient:billing:9.1.0') { version { strictly '9.1.0' } }
    // 광고 브리지와 SDK는 debug에만 존재합니다. release에는 전이 의존성도 없습니다.
    debugImplementation('com.google.android.gms:play-services-ads:25.4.0') { version { strictly '25.4.0' } }
    debugImplementation('com.google.android.ump:user-messaging-platform:4.0.0') { version { strictly '4.0.0' } }
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// 테스트 도구가 포함된 웹 에셋으로 출시 빌드를 만들지 않습니다.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        def buildInfo = file('src/main/assets/public/build-info.json')
        try {
            def info = new groovy.json.JsonSlurper().parse(buildInfo)
            if (info.testTools != false || info.androidTestAds != false || info.androidTestBilling != false) throw new Exception('시험 기능 또는 불완전한 정보')
        } catch (Exception e) {
            throw new GradleException('출시 웹 에셋 검증 실패(시험/누락/손상). npm run android:sync 후 다시 빌드해 주세요.', e)
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
