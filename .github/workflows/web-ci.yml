name: 웹 테스트와 빌드

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Node ${{ matrix.node }} 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 설정
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 잠금 파일로 의존성 설치
        run: npm ci
      - name: 자동 테스트
        run: npm test
      - name: 타입 검사와 웹 빌드
        run: npm run build
      - name: 출시 빌드의 테스트 도구 제외 확인
        run: node -e "if(require('./dist/build-info.json').testTools !== false) process.exit(1)"
      - name: 테스트 도구 포함 빌드
        run: npm run build:test
      - name: 테스트 빌드 구분 확인
        run: node -e "if(require('./dist/build-info.json').testTools !== true) process.exit(1)"
